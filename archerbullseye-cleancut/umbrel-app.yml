dependencies: []
releaseNotes: >-
  Softened subtitles now cover the same words the detector flags. The detector
  matches inflected forms -- porno, fuckers, raped -- but the replacement map
  holds only base forms, so those words were muted or cut in the audio while
  still appearing in full in the subtitle track. The softener now folds in the
  detector's own patterns and falls back to the longest matching base form.
  Innocent words are unaffected: assistant, assume and assessing stay as they
  are.
