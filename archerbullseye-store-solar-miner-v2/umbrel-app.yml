submitter: ArcherBullseye
submission: https://github.com/ArcherBullseye/ubiquitous-octo-funicular
repo: https://github.com/ArcherBullseye/solarv2
support: https://github.com/ArcherBullseye/solarv2/issues
gallery:
  - https://raw.githubusercontent.com/ArcherBullseye/ubiquitous-octo-funicular/master/archerbullseye-store-solar-miner-v2/icon.svg
releaseNotes: >-
  v2.0.3: The energy-flow diagram now spreads across the full card width
  with larger text, the three sats/BTC boxes are combined into one Earnings
  card, the forecast and Ramp Activity sit side by side, every card has a
  color accent, and the whole dashboard fits without scrolling.


  v2.0.2: Layout refinements — the battery SOC ring now lives inside the
  energy-flow diagram's battery node, Mining Control is compacted into the
  top-right column, the forecast and Ramp Activity moved up beside the
  stats, and the SOC & Power chart is much wider.


  v2.0.1: Dashboard now fits on one screen — shorter energy-flow diagram,
  pool/BTC/dehumidifier stats tucked beside Mining Control, and the Ramp
  Activity log as a scrollable column beside the charts, with tighter
  spacing throughout.


  v2.0.0: First release of Solar Miner v2 — a ground-up refactor of Solar
  Miner for clarity and future expansion (thermostat control is next), with
  a redesigned dashboard: live animated energy-flow diagram (solar, battery,
  grid, home, miners), battery SOC ring, per-miner power-step bars with ramp
  targets, and a ramp activity timeline. The control engine carries over
  unchanged from v1.5.17, including the curtail-aware miner state fix. The
  database is fully v1-compatible — copy your existing data directory over
  and every reading, setting, and learned efficiency curve carries across.
