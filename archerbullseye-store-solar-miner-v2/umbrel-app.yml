releaseNotes: >-
  v2.3.0: Added a Dehumidifier device type with ON/OFF control, humidity,
  target humidity, tank status, and automation support. Device icons are
  green when connected and ON, yellow when connected and OFF, and red
  when communication is unavailable. A new device information view shows
  reported measurements and read-only diagnostics. Tuya discovery can add
  supported watts, amps, voltage, energy, battery, and other status mappings
  to existing devices while preserving manual mappings and credentials.
  Electrical readings appear only when the hardware exposes them. Home
  shares the dashboard dehumidifier connection and pauses the older auto
  controller when managing the same device; use Home rules for automation.


  v2.2.0: Expanded Home automations with dedicated plug ON and OFF actions,
  battery SOC and excess power conditions, and dashboard readings for
  solar, grid, battery, household loads, weather, miners, pool earnings,
  Bitcoin price, Smart Start, end-of-day protection, and the dehumidifier.
  Includes inclusive thresholds, numeric ranges, live condition readings,
  and a shortcut for creating paired solar plug ON/OFF rules. Templates
  start paused for review. Conditions use each source's own freshness
  timestamps; existing devices and automations are preserved.


  v2.1.2: Fixed Tuya QR sign-in rejecting valid regional account servers
  with an unsupported endpoint error. Home now accepts Tuya's regional
  HTTPS addresses and normalizes trailing slashes before loading devices.
  Update, request a fresh QR code, and approve it in Smart Life or Tuya Smart.


  v2.1.1: Home can now discover Tuya devices on your LAN and import the
  devices paired to your Smart Life or Tuya Smart account. Use Discover
  devices to scan the network, sign in with a QR code, and review hubs,
  sensors, and smart plugs before importing. Local keys and Zigbee node
  IDs are retrieved automatically. Existing devices and automations are
  preserved; incomplete connections import disabled for review. Account
  storage is optional, and device readings and controls remain local.


  v2.1.0: Open the new Home workspace from the dashboard to manage
  multiple temperature sensors and smart plugs. Drag device cards to
  arrange them, and build automation rules from temperature, humidity,
  plug state, solar readings, and time windows. Actions can switch plugs
  or send Telegram messages. Includes manual controls, automation holds,
  cooldowns, and an activity log. Existing Home sensor settings and
  temperature alerts migrate automatically on first startup.


  v2.0.8: A Home card beside Smart Start shows temperature and humidity
  from a paired Zigbee sensor through a local Tuya gateway. Each reading
  row shows the last report status. Open the Home card settings to connect
  a sensor and enable Telegram alerts when temperature crosses your limits.


  v2.0.7: New Telegram alert for underpowered mining - if the Solis
  inverter reports the mining circuit drawing far less than what's
  currently commanded (e.g. a hashboard silently drops offline), you get
  a notification after a sustained delay, with a wide default variance
  to avoid false alarms from normal power swings. Requires miner
  nameplate power to be set under Settings > Miners.


  v2.0.6: Fixed two flow-diagram animation direction bugs - Solar was
  always animating backwards (hub to solar) since the v2.0.5 layout
  redesign, and Grid's dashes reversed on export instead of import, so the
  direction never matched whether you were actually importing or exporting.
  Both verified against an isolated animation test before shipping.


  v2.0.5: The energy-flow diagram is noticeably more compact - Solar and
  Grid now sit closer to the hub and to the battery line instead of
  directly above/below it, shrinking the whole top section's height so the
  SOC & Power and Daily Earnings charts no longer get pushed off the page.
  Flow-diagram icons enlarged to fill their circles better.


  v2.0.4: Bigger, less cramped energy-flow diagram (larger circles and
  type, no more letterboxed blank space), a hand-drawn transmission-pylon
  icon for the grid node instead of the tower emoji, a simplified Earnings
  card (bigger amounts, no uptime%/"per BTC" clutter, large sat counts
  abbreviated so they never truncate), and a cleaner weather card layout.


  v2.0.3: The energy-flow diagram now spreads across the full card width
  with larger text, the three sats/BTC boxes are combined into one Earnings
  card, the forecast and Ramp Activity sit side by side, every card has a
  color accent, and the whole dashboard fits without scrolling.


  v2.0.2: Layout refinements — the battery SOC ring now lives inside the
  energy-flow diagram's battery node, Mining Control is compacted into the
  top-right column, the forecast and Ramp Activity moved up beside the
  stats, and the SOC & Power chart is much wider.


  v2.0.1: Dashboard now fits on one screen — shorter energy-flow diagram,
  pool/BTC/dehumidifier stats tucked beside Mining Control, and the Ramp
  Activity log as a scrollable column beside the charts, with tighter
  spacing throughout.


  v2.0.0: First release of Solar Miner v2 — a ground-up refactor of Solar
  Miner for clarity and future expansion (thermostat control is next), with
  a redesigned dashboard: live animated energy-flow diagram (solar, battery,
  grid, home, miners), battery SOC ring, per-miner power-step bars with ramp
  targets, and a ramp activity timeline. The control engine carries over
  unchanged from v1.5.17, including the curtail-aware miner state fix. The
  database is fully v1-compatible — copy your existing data directory over
  and every reading, setting, and learned efficiency curve carries across.
